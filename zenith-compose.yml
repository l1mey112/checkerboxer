x-zenith:
  catalog:
    name: Checkerboxer
    description: One shared Markdown page with live checklists, a task board, focus timer, and shared XP. Deploy once and get things done together.
    authors: [Liam Leadbetter]
    source: https://github.com/l1mey112/checkerboxer
    license: UNLICENSED
    tags: [productivity, markdown, checklist]
  expose:
    - { service: web, port: 3000, web: true }

services:
  web:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
    ports:
      - "3000:3000"
    volumes:
      - checkerboxer-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  checkerboxer-data:
